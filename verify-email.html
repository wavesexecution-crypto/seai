<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verify email — SEAI</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/auth.css" />
<style>
  .auth-wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 20px;
    background: #000000;
  }
  .auth-card { width: 100%; max-width: 420px; }
  .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: #fff; margin-bottom: 36px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; display: block; }
  .brand .n { font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }
  h1.title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.2; color: #fff; }
  p.subtitle { color: #a1a1aa; font-size: 14px; margin: 0 0 28px; }
  form { display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12.5px; font-weight: 500; color: #a1a1aa; letter-spacing: 0.02em; }
  .input-wrap { position: relative; }
  input {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 14.5px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 6px; color: #fff; outline: none;
    transition: border-color 0.14s ease, background 0.14s ease;
  }
  input::placeholder { color: #63636b; }
  input:focus { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); }
  input.input-error { border-color: #e0605e; }
  .btn {
    width: 100%; padding: 13px 16px; font: inherit; font-size: 14.5px;
    font-weight: 600; border: none; border-radius: 6px; cursor: pointer;
    transition: opacity 0.14s ease, transform 0.14s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { background: #fff; color: #000; }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:active { transform: scale(0.995); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; color: #a1a1aa; border: 1px solid rgba(255,255,255,0.09); }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.22); color: #fff; }
  .state-msg { padding: 14px 16px; border-radius: 6px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .state-msg.error { background: rgba(224, 96, 94, 0.08); border: 1px solid rgba(224, 96, 94, 0.2); color: #e0605e; }
  .state-msg.success { background: rgba(127, 182, 133, 0.08); border: 1px solid rgba(127, 182, 133, 0.2); color: #7fb685; }
  .auth-foot { margin-top: 24px; display: flex; justify-content: center; gap: 6px; font-size: 13.5px; color: #a1a1aa; }
  .auth-foot a { color: #fff; text-decoration: none; font-weight: 500; }
  .auth-foot a:hover { text-decoration: underline; }
  .success-screen { text-align: center; padding: 20px 0; }
  .success-icon { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; background: rgba(127, 182, 133, 0.1); border: 1px solid rgba(127, 182, 133, 0.25); }
  .success-icon svg { width: 22px; height: 22px; stroke: #7fb685; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/">
      <img src="/logo.svg" width="26" height="26" alt="SEAI" />
      <span class="n">SEAI</span>
    </a>

    <div id="loadingView"><p class="subtitle">Verifying your email…</p></div>

    <div id="invalidView" style="display:none">
      <h1 class="title">Link expired</h1>
      <p class="subtitle">This verification link is invalid or has expired. Request a new one.</p>
      <button type="button" class="btn btn-primary" onclick="go('/resend-verification')">Resend verification</button>
    </div>

    <div id="formView" style="display:none">
      <h1 class="title">Verify your email</h1>
      <p class="subtitle">Enter the verification code sent to your email.</p>

      <div id="state" class="state-msg" style="display:none"></div>

      <form id="form" novalidate>
        <div class="field">
          <label for="token">Verification code</label>
          <div class="input-wrap">
            <input id="token" name="token" type="text" autocomplete="off" placeholder="Enter code" required maxlength="6" />
          </div>
          <span id="token-err" class="err-msg"></span>
        </div>

        <button type="submit" class="btn btn-primary" id="submit">Verify email</button>
      </form>
    </div>

    <div id="successView" class="success-screen" style="display:none">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1 class="title">Email verified</h1>
      <p class="subtitle">Your email address has been verified. You can now sign in.</p>
      <button type="button" class="btn btn-primary" onclick="go('/sign-in')" style="margin-top:8px">Sign in</button>
    </div>
  </div>
</div>

<script>
'use strict';

async function api(path, body) {
  const r = await fetch('https://ops.seai.store/api/auth' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body ?? {}),
    credentials: 'include',
  });
  let data = {};
  try { data = await r.json(); } catch { /* ignore */ }
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function setField(inputId, msg) {
  const input = document.getElementById(inputId);
  const errEl = document.getElementById(inputId + '-err');
  if (input) input.classList.toggle('input-error', !!msg);
  if (errEl) errEl.textContent = msg || '';
}

function clearErrors(inputIds) {
  inputIds.forEach((id) => setField(id, ''));
}

function setLoading(btn, loading) {
  if (loading) {
    btn.dataset.original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite"></span>';
  } else {
    btn.disabled = false;
    btn.innerHTML = btn.dataset.original || btn.textContent;
  }
}

function showState(elId, type, msg) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.className = 'state-msg ' + type;
  el.textContent = msg;
  el.style.display = 'flex';
}
function hideState(elId) {
  const el = document.getElementById(elId);
  if (el) el.style.display = 'none';
}

function go(path) { window.location.href = path; }

(function () {
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideState('state');
    const token = document.getElementById('token').value.trim();
    setField('token', '');
    if (!token) { setField('token', 'Verification code is required'); return; }
    setLoading(submit, true);
    try {
      await api('/verify-email', { token });
      show(successView);
    } catch (err) {
      showState('state', 'error', err.message);
      setLoading(submit, false);
    }
  });
})();
</script>
</body>
</html>
