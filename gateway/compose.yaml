services:
  postgres:
    image: postgres:16-alpine
    container_name: seai-gateway-pg
    environment:
      POSTGRES_USER: seai_gateway
      POSTGRES_PASSWORD: seai_gateway_dev_only
      POSTGRES_DB: seai_gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seai_gateway -d seai_gateway"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - seai_gateway_pgdata:/var/lib/postgresql/data

volumes:
  seai_gateway_pgdata: