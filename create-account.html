<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create account — SEAI</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/auth.css" />
<style>
  .auth-wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 20px;
    background: #000000;
  }
  .auth-card { width: 100%; max-width: 420px; }
  .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: #fff; margin-bottom: 36px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; display: block; }
  .brand .n { font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }
  h1.title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.2; color: #fff; }
  p.subtitle { color: #a1a1aa; font-size: 14px; margin: 0 0 28px; }
  form { display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12.5px; font-weight: 500; color: #a1a1aa; letter-spacing: 0.02em; }
  .input-wrap { position: relative; }
  input {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 14.5px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 6px; color: #fff; outline: none;
    transition: border-color 0.14s ease, background 0.14s ease;
  }
  input::placeholder { color: #63636b; }
  input:focus { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); }
  input.input-error { border-color: #e0605e; }
  .toggle-vis {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #63636b; cursor: pointer;
    padding: 4px 6px; font-size: 12px; font-weight: 500; border-radius: 4px;
    transition: color 0.14s ease;
  }
  .toggle-vis:hover { color: #a1a1aa; }
  .err-msg { font-size: 12.5px; color: #e0605e; min-height: 18px; display: block; }
  .strength { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
  .strength .bar { height: 3px; flex: 1; border-radius: 2px; background: rgba(255,255,255,0.09); transition: background 0.22s ease; }
  .strength .bar.on { background: #e0605e; }
  .strength .bar.on.mid { background: #d2a24a; }
  .strength .bar.on.strong { background: #7fb685; }
  .strength-label { font-size: 11.5px; color: #63636b; margin-left: 6px; }
  .requirements { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 3px; }
  .requirements li { font-size: 12px; color: #63636b; display: flex; align-items: center; gap: 6px; transition: color 0.14s ease; }
  .requirements li.met { color: #a1a1aa; }
  .requirements li .dot { width: 5px; height: 5px; border-radius: 50%; background: #63636b; flex-shrink: 0; transition: background 0.14s ease; }
  .requirements li.met .dot { background: #7fb685; }
  .btn {
    width: 100%; padding: 13px 16px; font: inherit; font-size: 14.5px;
    font-weight: 600; border: none; border-radius: 6px; cursor: pointer;
    transition: opacity 0.14s ease, transform 0.14s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { background: #fff; color: #000; }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:active { transform: scale(0.995); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; color: #a1a1aa; border: 1px solid rgba(255,255,255,0.09); }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.22); color: #fff; }
  .btn-link { background: none; border: none; color: #a1a1aa; cursor: pointer; font: inherit; font-size: 13.5px; padding: 4px; text-align: center; transition: color 0.14s ease; }
  .btn-link:hover { color: #fff; }
  .state-msg { padding: 14px 16px; border-radius: 6px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .state-msg.error { background: rgba(224, 96, 94, 0.08); border: 1px solid rgba(224, 96, 94, 0.2); color: #e0605e; }
  .auth-foot { margin-top: 24px; display: flex; justify-content: center; gap: 6px; font-size: 13.5px; color: #a1a1aa; }
  .auth-foot a { color: #fff; text-decoration: none; font-weight: 500; }
  .auth-foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/">
      <img src="/logo.svg" width="26" height="26" alt="SEAI" />
      <span class="n">SEAI</span>
    </a>

    <h1 class="title">Create account</h1>
    <p class="subtitle">Set up your SEAI account.</p>

    <div id="state" class="state-msg" style="display:none"></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="fullName">Full name</label>
        <div class="input-wrap">
          <input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="Your name" required />
        </div>
        <span id="fullName-err" class="err-msg"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required />
        </div>
        <span id="email-err" class="err-msg"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required />
          <button type="button" class="toggle-vis" aria-label="Show password" onclick="toggleVisibility('password', this)">Show</button>
        </div>
        <div class="strength" id="strength">
          <div class="bar" id="bar1"></div>
          <div class="bar" id="bar2"></div>
          <div class="bar" id="bar3"></div>
          <div class="bar" id="bar4"></div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
        <ul class="requirements" id="reqs">
          <li id="req-length"><span class="dot"></span> At least 8 characters</li>
          <li id="req-upper"><span class="dot"></span> One uppercase letter</li>
          <li id="req-lower"><span class="dot"></span> One lowercase letter</li>
          <li id="req-number"><span class="dot"></span> One number</li>
          <li id="req-symbol"><span class="dot"></span> One symbol</li>
        </ul>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="input-wrap">
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password" required />
          <button type="button" class="toggle-vis" aria-label="Show password" onclick="toggleVisibility('confirmPassword', this)">Show</button>
        </div>
        <span id="confirmPassword-err" class="err-msg"></span>
      </div>

      <button type="submit" class="btn btn-primary" id="submit">Create account</button>
    </form>

    <div class="auth-foot">
      <span>Already have an account?</span>
      <a href="/sign-in">Sign in</a>
    </div>
  </div>
</div>

<script>
/* SEAI auth client — shared helpers for auth flows */
'use strict';

async function api(path, body) {
  const r = await fetch('https://ops.seai.store/api/auth' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body ?? {}),
    credentials: 'include',
  });
  let data = {};
  try { data = await r.json(); } catch { /* ignore */ }
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim());
}

function toggleVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Hide' : 'Show';
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}

function setField(inputId, msg) {
  const input = document.getElementById(inputId);
  const errEl = document.getElementById(inputId + '-err');
  if (input) input.classList.toggle('input-error', !!msg);
  if (errEl) errEl.textContent = msg || '';
}

function clearErrors(inputIds) {
  inputIds.forEach((id) => setField(id, ''));
}

function setLoading(btn, loading) {
  if (loading) {
    btn.dataset.original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite"></span>';
  } else {
    btn.disabled = false;
    btn.innerHTML = btn.dataset.original || btn.textContent;
  }
}

function showState(elId, type, msg) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.className = 'state-msg ' + type;
  el.textContent = msg;
  el.style.display = 'flex';
}
function hideState(elId) {
  const el = document.getElementById(elId);
  if (el) el.style.display = 'none';
}

function go(path) { window.location.href = path; }

function scorePassword(pw) {
  const met = {
    length: pw.length >= 8,
    upper: /[A-Z]/.test(pw),
    lower: /[a-z]/.test(pw),
    number: /[0-9]/.test(pw),
    symbol: /[^A-Za-z0-9]/.test(pw),
  };
  const passed = Object.values(met).filter(Boolean).length;
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12 && passed >= 3) score++;
  if (passed >= 4) score++;
  if (passed >= 5 && pw.length >= 12) score++;
  const labels = ['Too weak', 'Weak', 'Fair', 'Good', 'Strong'];
  return { score, label: labels[score], met };
}

(function () {
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const ids = ['fullName', 'email', 'password', 'confirmPassword'];
  const pwInput = document.getElementById('password');

  function updateStrength() {
    const pw = pwInput.value;
    const { score, label, met } = scorePassword(pw);
    const bars = ['bar1', 'bar2', 'bar3', 'bar4'];
    bars.forEach((id, i) => {
      const el = document.getElementById(id);
      el.className = 'bar' + (i < score ? ' on' : '');
      if (i < score) { el.classList.remove('mid', 'strong'); if (score >= 3) el.classList.add('strong'); else if (score >= 2) el.classList.add('mid'); }
    });
    document.getElementById('strengthLabel').textContent = pw ? label : '';
    document.getElementById('req-length').classList.toggle('met', met.length);
    document.getElementById('req-upper').classList.toggle('met', met.upper);
    document.getElementById('req-lower').classList.toggle('met', met.lower);
    document.getElementById('req-number').classList.toggle('met', met.number);
    document.getElementById('req-symbol').classList.toggle('met', met.symbol);
  }
  pwInput.addEventListener('input', updateStrength);

  function validate() {
    let ok = true;
    clearErrors(ids);
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const pw = pwInput.value;
    const confirm = document.getElementById('confirmPassword').value;
    if (!fullName) { setField('fullName', 'Full name is required'); ok = false; }
    if (!email) { setField('email', 'Email is required'); ok = false; }
    else if (!isValidEmail(email)) { setField('email', 'Enter a valid email'); ok = false; }
    if (!pw) { setField('password', 'Password is required'); ok = false; }
    else if (pw.length < 8) { setField('password', 'Password must be at least 8 characters'); ok = false; }
    if (!confirm) { setField('confirmPassword', 'Please confirm your password'); ok = false; }
    else if (pw !== confirm) { setField('confirmPassword', 'Passwords do not match'); ok = false; }
    return ok;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideState('state');
    if (!validate()) return;
    setLoading(submit, true);
    try {
      const data = await api('/sign-up', {
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: pwInput.value,
        confirmPassword: document.getElementById('confirmPassword').value,
      });
      const role = data.user?.role || 'customer';
      const isStaff = ['owner', 'administrator', 'admin', 'sales', 'account_manager', 'project_manager', 'marketing', 'designer', 'developer', 'finance', 'support'].includes(role);
      if (isStaff) {
        go('https://ops.seai.store/overview');
      } else {
        go('https://dash.seai.store/overview');
      }
    } catch (err) {
      showState('state', 'error', err.message);
      setLoading(submit, false);
    }
  });
})();
</script>
</body>
</html>
