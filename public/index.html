<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SEAI — AI that operates your Shopify business</title>
<meta name="description" content="SEAI is an autonomous commerce operating system for Shopify." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- Shopify App Bridge (loaded only when embedded; see app.js) -->
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<style>
  /* ============ SEAI VX design tokens ============ */
  :root {
    --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --r-s: 6px;
    --r: 8px;
    --t-fast: 140ms ease;
    --t-med: 220ms ease;
  }
  [data-theme="dark"] {
    --bg: #0a0a0b;
    --bg-soft: #101013;
    --ink: #f4f4f5;
    --sub: #a1a1aa;
    --faint: #63636b;
    --line: rgba(255, 255, 255, 0.09);
    --line-soft: rgba(255, 255, 255, 0.055);
    --fill: rgba(255, 255, 255, 0.032);
    --fill-hover: rgba(255, 255, 255, 0.06);
    --btn-bg: #f4f4f5;
    --btn-ink: #0a0a0b;
    --ring: rgba(255, 255, 255, 0.22);
    --good: #7fb685;
    --warn: #d2a24a;
    --bad: #e0605e;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  [data-theme="light"] {
    --bg: #fafafa;
    --bg-soft: #ffffff;
    --ink: #131316;
    --sub: #5f5f66;
    --faint: #a2a2ab;
    --line: rgba(0, 0, 0, 0.1);
    --line-soft: rgba(0, 0, 0, 0.06);
    --fill: rgba(0, 0, 0, 0.028);
    --fill-hover: rgba(0, 0, 0, 0.055);
    --btn-bg: #131316;
    --btn-ink: #ffffff;
    --ring: rgba(0, 0, 0, 0.2);
    --good: #3d7a4e;
    --warn: #96690f;
    --bad: #c04543;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
  }

  /* ============ base ============ */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    font-feature-settings: "cv11", "ss01";
  }
  ::selection { background: var(--ink); color: var(--bg); }
  .tnum { font-variant-numeric: tabular-nums; }
  .skip {
    position: absolute; left: -999px; top: 0; background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 0 0 var(--r-s) 0; z-index: 200; font-size: 13px; font-weight: 600;
  }
  .skip:focus { left: 0; }

  /* ============ header ============ */
  .top {
    position: sticky; top: 0; z-index: 60;
    background: var(--bg);
    border-bottom: 1px solid var(--line-soft);
  }
  .top-in {
    max-width: 1180px; margin: 0 auto; padding: 0 28px; height: 62px;
    display: flex; align-items: center; gap: 20px;
  }
  .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); }
  .brand img { width: 23px; height: 23px; border-radius: 6px; display: block; }
  .brand .n { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
  .brand .t { font-size: 12.5px; color: var(--faint); font-weight: 400; border-left: 1px solid var(--line); padding-left: 20px; margin-left: 4px; white-space: nowrap; }
  .top-meta { margin-left: auto; display: flex; align-items: center; gap: 22px; }
  .meta { text-align: right; line-height: 1.35; }
  .meta .k { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  .meta .v { font-size: 13px; font-weight: 500; color: var(--ink); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iconbtn {
    appearance: none; border: 1px solid transparent; background: transparent; color: var(--sub);
    width: 32px; height: 32px; border-radius: var(--r-s); cursor: pointer;
    display: inline-grid; place-items: center; transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast);
  }
  .iconbtn:hover { color: var(--ink); background: var(--fill); border-color: var(--line-soft); }
  .iconbtn svg { width: 15px; height: 15px; }

  /* ============ layout ============ */
  .layout { max-width: 1180px; margin: 0 auto; padding: 0 28px; display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 56px; align-items: start; }
  .nav { position: sticky; top: 62px; padding: 40px 0; display: flex; flex-direction: column; gap: 1px; max-height: calc(100vh - 62px); overflow: auto; }
  .nav a {
    color: var(--sub); text-decoration: none; font-size: 13.5px; font-weight: 500;
    padding: 7px 0 7px 14px; border-left: 1px solid var(--line-soft); margin-left: 1px;
    transition: color var(--t-fast), border-color var(--t-fast);
  }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--ink); border-left-color: var(--ink); }
  .nav .foot { margin-top: 28px; padding-left: 15px; font-size: 11.5px; line-height: 1.7; color: var(--faint); }
  main { padding: 48px 0 40px; min-width: 0; max-width: 800px; }
  main:focus { outline: none; }

  /* ============ primitives: type ============ */
  .eyebrow { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .display { margin: 0 0 10px; font-size: clamp(30px, 4.4vw, 42px); line-height: 1.12; font-weight: 600; letter-spacing: -0.025em; }
  .h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
  .lede { margin: 0; color: var(--sub); font-size: 14.5px; max-width: 60ch; }
  .sec { padding: 44px 0; border-top: 1px solid var(--line-soft); }
  .sec:first-child { border-top: none; padding-top: 0; }
  .sec > .eyebrow { margin-bottom: 14px; }
  .body-s { font-size: 13.5px; color: var(--sub); }
  .meta-s { font-size: 12px; color: var(--faint); }

  /* ============ primitives: rows / dividers ============ */
  .rows { margin-top: 6px; }
  .row {
    display: flex; align-items: baseline; gap: 16px;
    padding: 13px 0; border-top: 1px solid var(--line-soft); font-size: 14px;
  }
  .row:first-child { border-top: none; }
  .row .l { font-weight: 500; }
  .row .r { margin-left: auto; color: var(--sub); text-align: right; font-size: 13.5px; }
  .row .r.strong { color: var(--ink); }
  .tag {
    display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--sub); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 8px; vertical-align: 1px; }
  .dot.ok { background: var(--good); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .dot.live { background: var(--ink); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* ============ primitives: buttons / inputs ============ */
  .btn {
    appearance: none; font: inherit; font-size: 13.5px; font-weight: 600;
    background: var(--btn-bg); color: var(--btn-ink);
    border: 1px solid var(--btn-bg); border-radius: var(--r);
    padding: 10px 20px; cursor: pointer; white-space: nowrap;
    transition: opacity var(--t-fast), transform var(--t-fast);
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
  .btn-quiet {
    appearance: none; font: inherit; font-size: 13.5px; font-weight: 500; color: var(--sub);
    background: transparent; border: 1px solid var(--line); border-radius: var(--r);
    padding: 9px 16px; cursor: pointer; transition: color var(--t-fast), border-color var(--t-fast), background var(--t-fast);
  }
  .btn-quiet:hover { color: var(--ink); border-color: var(--sub); }
  .input, .textarea {
    width: 100%; font: inherit; color: var(--ink);
    background: var(--fill); border: 1px solid var(--line); border-radius: var(--r);
    padding: 11px 13px; outline: none;
    transition: border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
  }
  .input::placeholder, .textarea::placeholder { color: var(--faint); }
  .input:focus, .textarea:focus { border-color: var(--sub); background: transparent; box-shadow: 0 0 0 3px var(--ring); }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 12.5px; font-weight: 600; color: var(--sub); margin-bottom: 7px; }
  .switchrow { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--sub); }
  .switch { position: relative; width: 38px; height: 22px; appearance: none; -webkit-appearance: none; background: var(--fill-hover); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; margin: 0; padding: 0; transition: background var(--t-fast); flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--sub); transition: transform var(--t-fast), background var(--t-fast); }
  .switch:checked { background: var(--ink); border-color: var(--ink); }
  .switch:checked::after { transform: translateX(16px); background: var(--bg); }
  kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; color: var(--sub); }

  /* ============ command surface ============ */
  .cmd { border: 1px solid var(--line); border-radius: 10px; background: var(--bg-soft); box-shadow: var(--shadow); margin-top: 26px; overflow: hidden; }
  .cmd textarea {
    width: 100%; border: none; background: transparent; color: var(--ink);
    font: inherit; font-size: 19px; line-height: 1.5; letter-spacing: -0.01em;
    padding: 22px 22px 8px; resize: none; outline: none; min-height: 76px;
  }
  .cmd textarea::placeholder { color: var(--faint); }
  .cmd-bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line-soft); }
  .cmd-bar .sp { flex: 1; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .ex {
    appearance: none; font: inherit; font-size: 13px; color: var(--sub);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 15px; cursor: pointer; transition: color var(--t-fast), border-color var(--t-fast);
  }
  .ex:hover { color: var(--ink); border-color: var(--sub); }

  /* ============ timeline ============ */
  .tl { list-style: none; margin: 22px 0 0; padding: 0; }
  .tl li { position: relative; padding: 0 0 20px 26px; font-size: 14px; }
  .tl li:last-child { padding-bottom: 2px; }
  .tl li::before {
    content: ""; position: absolute; left: 5px; top: 20px; bottom: -2px; width: 1px; background: var(--line);
  }
  .tl li:last-child::before { display: none; }
  .tl .p { position: absolute; left: 0; top: 7px; width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--faint); background: var(--bg); }
  .tl li.done .p { background: var(--ink); border-color: var(--ink); }
  .tl li.active .p { border-color: var(--ink); background: var(--ink); animation: pulse 1.1s ease-in-out infinite; }
  .tl li.blocked .p { background: var(--warn); border-color: var(--warn); }
  .tl .t { font-weight: 500; }
  .tl li.wait .t { color: var(--faint); font-weight: 400; }
  .tl .s { font-size: 12.5px; color: var(--faint); }

  /* ============ activity ============ */
  .act { border-top: 1px solid var(--line-soft); padding: 18px 0; }
  .act:first-child { border-top: none; }
  .act .what { font-size: 15px; font-weight: 500; letter-spacing: -0.005em; margin: 0 0 3px; }
  .act .when { font-size: 12.5px; color: var(--faint); }
  .act details { margin-top: 10px; }
  .act summary { font-size: 13px; color: var(--sub); cursor: pointer; font-weight: 500; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  .act summary::-webkit-details-marker { display: none; }
  .act summary::before { content: "+"; font-weight: 400; color: var(--faint); }
  .act details[open] summary::before { content: "–"; }
  .act summary:hover { color: var(--ink); }
  .ev { margin: 12px 0 0; padding: 0 0 0 14px; border-left: 1px solid var(--line); font-size: 13.5px; color: var(--sub); display: grid; gap: 8px; }
  .ev b { color: var(--ink); font-weight: 600; display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  pre.code {
    font-family: var(--mono); font-size: 12px; line-height: 1.65; color: var(--sub);
    background: var(--fill); border: 1px solid var(--line-soft); border-radius: var(--r);
    padding: 14px 16px; white-space: pre-wrap; word-break: break-word;
    max-height: 300px; overflow: auto; margin: 12px 0 0;
  }
  .empty { padding: 34px 0; color: var(--faint); font-size: 14px; }
  .empty .h2 { color: var(--sub); }

  details.adv { margin-top: 18px; border-top: 1px solid var(--line-soft); padding-top: 14px; }
  details.adv summary { font-size: 13px; color: var(--sub); cursor: pointer; font-weight: 500; list-style: none; }
  details.adv summary::-webkit-details-marker { display: none; }
  details.adv summary:hover { color: var(--ink); }

  /* ============ toast / footer ============ */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 500;
    padding: 11px 20px; border-radius: 999px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity var(--t-med), transform var(--t-med); z-index: 100;
    max-width: min(92vw, 560px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer.site { border-top: 1px solid var(--line-soft); }
  footer.site .in { max-width: 1180px; margin: 0 auto; padding: 22px 28px 34px; display: flex; gap: 16px; font-size: 12px; color: var(--faint); }
  footer.site .r { margin-left: auto; }

  :focus-visible { outline: 2px solid var(--sub); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ============ responsive: true layout shifts, not shrinks ============ */
  @media (max-width: 960px) {
    .brand .t { display: none; }
    .top-meta .meta.hide-m { display: none; }
    .layout { grid-template-columns: 1fr; gap: 0; }
    .nav {
      position: static; flex-direction: row; gap: 4px; padding: 12px 0;
      max-height: none; overflow-x: auto; border-bottom: 1px solid var(--line-soft);
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { border-left: none; border-bottom: 1px solid transparent; padding: 8px 12px; margin: 0; white-space: nowrap; }
    .nav a[aria-current="page"] { border-bottom-color: var(--ink); }
    .nav .foot { display: none; }
    main { padding: 32px 0; max-width: none; }
    .sec { padding: 32px 0; }
    .top-in, .layout, footer.site .in { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/overview" data-nav>
      <img src="/logo.svg" width="23" height="23" alt="SEAI" />
      <span class="n">SEAI</span>
      <span class="t">AI that operates your Shopify business</span>
    </a>
    <div class="top-meta">
      <div class="meta hide-m"><div class="k">Store</div><div class="v" id="hm-store">—</div></div>
      <div class="meta hide-m"><div class="k">Model</div><div class="v" id="hm-model">—</div></div>
      <div class="meta"><div class="k">Autonomy</div><div class="v" id="hm-autonomy">—</div></div>
      <button class="iconbtn" id="theme-btn" title="Appearance" aria-label="Toggle appearance">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4"/></svg>
      </button>
      <button class="iconbtn" id="signout-btn" title="Sign out" aria-label="Sign out" onclick="Auth.signOut()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14H3a1 1 0 01-1-1V3a1 1 0 011-1h3M10.5 11.5l3.5-3.5-3.5-3.5M14 8H6"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="nav" aria-label="Primary">
    <a href="/portfolio" data-nav>Portfolio</a>
    <a href="/overview" data-nav>Overview</a>
    <a href="/command" data-nav>Command</a>
    <a href="/activity" data-nav>Activity</a>
    <a href="/provider" data-nav>Provider</a>
    <a href="/tools" data-nav>Tools</a>
    <a href="/system" data-nav>System</a>
    <div class="sep" style="border-top:1px solid var(--line-soft);margin:14px 0 10px"></div>
    <label for="store-sel" style="font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 0 6px 15px">Store</label>
    <select id="store-sel" aria-label="Active store" style="margin:0 0 0 15px;max-width:150px;font:inherit;font-size:13px;color:var(--ink);background:var(--fill);border:1px solid var(--line);border-radius:6px;padding:7px 9px;outline:none"></select>
    <div class="foot">SEAI acts through policy-gated Shopify tools. Nothing is fabricated.</div>
  </nav>
  <main id="view" tabindex="-1" aria-live="off"></main>
</div>

<footer class="site"><div class="in"><span>SEAI · Autonomous commerce operator</span><span class="r" id="foot">—</span></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/lang.js"></script>
<script src="/app.js"></script>
</body>
</html>
