<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forgot password — SEAI</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/auth.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/">
      <img src="/logo.svg" width="26" height="26" alt="SEAI" />
      <span class="n">SEAI</span>
    </a>

    <div id="formView">
      <h1 class="title">Forgot password</h1>
      <p class="subtitle">Enter your email and we'll send a reset link.</p>

      <div id="state" class="state-msg" style="display:none"></div>

      <form id="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required />
          </div>
          <span id="email-err" class="err-msg"></span>
        </div>

        <button type="submit" class="btn btn-primary" id="submit">Send reset link</button>
      </form>
    </div>

    <div id="successView" class="success-screen" style="display:none">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1 class="title">Check your email</h1>
      <p class="subtitle">If an account exists for <strong id="sentEmail" style="color:var(--ink)"></strong>, a password reset link has been sent. It expires in 1 hour.</p>
      <button type="button" class="btn btn-ghost" onclick="go('/sign-in')" style="margin-top:16px">Back to sign in</button>
    </div>

    <div class="auth-foot">
      <a href="/sign-in">Back to sign in</a>
    </div>
  </div>
</div>

<script src="/auth.js"></script>
<script>
(function () {
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideState('state');
    const email = document.getElementById('email').value.trim();
    setField('email', '');
    if (!email) { setField('email', 'Email is required'); return; }
    if (!isValidEmail(email)) { setField('email', 'Enter a valid email'); return; }
    setLoading(submit, true);
    try {
      await api('/forgot-password', { email });
      document.getElementById('sentEmail').textContent = email;
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    } catch (err) {
      showState('state', 'error', err.message);
      setLoading(submit, false);
    }
  });
})();
</script>
</body>
</html>
